name: Analysis tests

on:
  push:
    branches:
      - main
      - dev/analysis-refactor
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analysis-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      MPLBACKEND: Agg

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            analysis/requirements.txt
            analysis/requirements-test.txt

      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r analysis/requirements-test.txt
          python -m pip check

      - name: Run existing analysis tests
        run: python -m pytest analysis/tests -q
